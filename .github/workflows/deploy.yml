# Builds Pagewright (editor + site, static) and publishes it twice, one
# build per address (each has its own root):
#   GitHub Pages - https://garevna.github.io/sve-studio/
#                  (Settings > Pages > Source must be "GitHub Actions");
#   Cloudflare   - https://pagewright.pp.ua/ (deploy/cloudflare/), runs
#                  once the repository has the variable CLOUDFLARE_ACCOUNT_ID
#                  and the secret CLOUDFLARE_API_TOKEN.
#
# Files only one address must have - Google Search Console's verification
# file is a different one for each - live in deploy/<target>/public/ and
# are copied into that target's build only.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NUXT_APP_BASE_URL: /sve-studio/
      # Search Console by meta tag instead of a file (optional; Settings >
      # Secrets and variables > Actions > Variables). Empty = no tag.
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION_PAGES }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: node scripts/gh-pages-404.mjs .output/public /sve-studio/
      - run: cp -r deploy/github-pages/public/. .output/public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  cloudflare:
    if: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    environment:
      name: cloudflare
      url: https://pagewright.pp.ua/
    env:
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION_CLOUDFLARE }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Root "/": no NUXT_APP_BASE_URL.
      - run: pnpm generate
      - run: cp -r deploy/cloudflare/public/. .output/public/
      - run: pnpm dlx wrangler@4.160.0 deploy --config deploy/cloudflare/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
