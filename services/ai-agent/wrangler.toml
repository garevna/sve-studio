# Pagewright's AI assistant (see src/index.js). Not used by a client's site -
# that gets its own copy of this worker, on its own Cloudflare account, so
# that its usage is counted and paid on its own account and never on ours.
name = "pagewright-ai"
main = "src/index.js"
compatibility_date = "2025-01-01"
# The worker's address is the one the editor uses; no preview addresses.
preview_urls = false

# Logs in the dashboard (Observability) - where a refused call says why.
[observability]
enabled = true

# Workers AI. Reached through the binding, so there is no API key anywhere -
# nothing to leak and nothing to rotate.
[ai]
binding = "AI"

# The day's counters. Create it once and put its id here:
#   npx wrangler kv namespace create BUDGET
[[kv_namespaces]]
binding = "BUDGET"
id = "03b6d5d3c8914da98cd1e9c97767b5c3"

[vars]
# The sites allowed to call: the published demo and local dev.
ALLOWED_ORIGINS = "https://garevna.github.io,http://localhost:3006,http://localhost:3007"

# Whose Firebase ID tokens are accepted. Not a secret - the project id is in
# the site's own global.json and in every page that signs anybody in.
FIREBASE_PROJECT_ID = "pagewright-d9c8c"

# The model every task runs on. Check what the ACCOUNT actually has before
# changing it - `npx wrangler ai models`, not the documentation: the
# catalogue is not the same list everywhere. Two things found that way on
# 5 Nov 2026 -
#   @cf/meta/llama-3.1-8b-instruct      is not in it at all (only -fp8),
#   @cf/utter-project/eurollm-9b-it     is in it and answers with an error,
#   @cf/openai/gpt-oss-120b             is in it and answers with an error.
# A wrong or unusable id is not an error at deploy time: it deploys happily
# and every call then answers 502 'upstream'.
#
# This one was picked by comparing four models on the same Ukrainian quote,
# which is the language that separates them: it was the only one that read
# as fluent Ukrainian rather than as a translation. llama-3.1-8b-instruct-fp8
# is the cheap alternative - acceptable Ukrainian, and roughly four times as
# many calls a day inside the free allowance. Changing back is one line here
# and the ESTIMATE table in src/index.js.
MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# The ceilings. A free Cloudflare account gets 10,000 Neurons a day, reset at
# 00:00 UTC; these sit under that on purpose, because the worker's own count
# is an estimate with a margin (see ESTIMATE in src/index.js). With the 70B
# model above and its deliberately pessimistic estimates this is about
# fifteen pieces of work a day before the budget says come back tomorrow -
# which the page handles, showing the figure and saying the words are
# missing. Raise it after watching a day of real figures in the dashboard,
# not before.
DAILY_NEURONS = "6000"
DAILY_REQUESTS = "250"

# One ACCOUNT's share of the day. Every call needs a signed-in visitor, so
# this is the limit that holds: a new address is free, a new account is not.
VISITOR_REQUESTS = "12"

# No secrets. Workers AI needs none; if a client later wants a different
# provider, the key goes in with `npx wrangler secret put`, never here.
